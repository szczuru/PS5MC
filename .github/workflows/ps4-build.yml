name: PS4 build

on:
  workflow_dispatch:
  push:
    branches: [ps4-kodi-piers]
    paths:
      - 'ps4/**'
      - '.github/workflows/ps4-build.yml'

permissions:
  contents: read

concurrency:
  group: ps4-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Program testowy (probe) → PKG
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ps4
            .github
          sparse-checkout-cone-mode: false

      - name: Narzędzia systemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld cmake ninja-build curl git python3

      - name: libssl1.1 (wymagana przez PkgTool.Core)
        run: |
          curl -fsSL -o /tmp/libssl1.1.deb \
            http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
          sudo dpkg -i /tmp/libssl1.1.deb

      - name: Cache toolchain OpenOrbis
        uses: actions/cache@v4
        with:
          path: ~/OpenOrbis
          key: openorbis-v0.5.4-llvm18

      - name: Uprawnienia skryptów
        run: chmod +x ps4/scripts/*.sh

      - name: Pobierz toolchain
        run: bash ps4/scripts/00-fetch-toolchain.sh

      - name: Buduj probe PKG
        run: bash ps4/scripts/build-probe.sh "$GITHUB_WORKSPACE/dist/probe"

      - name: Weryfikacja
        run: |
          ls -la dist/probe/*.pkg
          test "$(stat -c%s dist/probe/*.pkg | head -1)" -gt 1000000

      - uses: actions/upload-artifact@v4
        with:
          name: ps4mc-probe-pkg
          path: dist/probe/*.pkg
          if-no-files-found: error

  # Etap M4 – pełny Kodi. Odblokować gdy ps4/scripts/build-kodi.sh będzie gotowe.
  kodi:
    name: Kodi (PS4MC) → PKG  [nieaktywne – czeka na M2/M3]
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Narzędzia
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld cmake ninja-build curl git python3 libssl-dev pkg-config nasm
      - name: libssl1.1
        run: |
          curl -fsSL -o /tmp/libssl1.1.deb \
            http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
          sudo dpkg -i /tmp/libssl1.1.deb
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ~/OpenOrbis
          key: openorbis-v0.5.4-llvm18
      - name: Pobierz toolchain
        run: bash ps4/scripts/00-fetch-toolchain.sh
      - name: Uprawnienia skryptów
        run: chmod +x ps4/scripts/*.sh

      - name: Buduj Kodi
        run: bash ps4/scripts/build-kodi.sh "$GITHUB_WORKSPACE/dist/kodi"
      - uses: actions/upload-artifact@v4
        with:
          name: ps4mc-kodi-pkg
          path: dist/kodi/*.pkg
          if-no-files-found: error
